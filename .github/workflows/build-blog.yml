name: Build Blog Posts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # Skip this job if the commit message contains "[skip ci]"
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (if any)
        run: |
          # If you have a requirements.txt, uncomment:
          # pip install -r requirements.txt
          echo "No extra dependencies needed."

      - name: Generate blog posts
        run: python generate_blog.py

      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate blog posts [skip ci]"
          branch: main
          file_pattern: blog/*.html
          # Only commit if there are changes
          skip_dirty_check: false
          skip_fetch: false
